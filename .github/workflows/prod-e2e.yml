name: Production E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Production suite to run
        required: true
        default: ui
        type: choice
        options:
          - api
          - ui
          - smoke
          - safe-desktop
          - safe-mobile
          - safe-full
          - integrations
  # Nightly assurance against the live stack. 06:00 UTC = 03:00 BRT —
  # off-hours for the Brazilian customer base, well before US morning.
  # Runs the safe-desktop suite (now includes documents.spec.ts) which
  # exercises the audit-remediated paths end-to-end. The suite costs
  # zero LLM credits and cleans up its own fixtures, so 365 nightly
  # runs leave no accumulation in the demo condo.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: production-e2e
  cancel-in-progress: false

env:
  # Opt into GitHub's upcoming Actions Node 24 runtime before it becomes the
  # hosted-runner default, so production checks catch compatibility issues now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_RATE_LIMIT_BYPASS_SECRET: ${{ secrets.E2E_RATE_LIMIT_BYPASS_SECRET }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_RESIDENT_EMAIL: ${{ secrets.E2E_RESIDENT_EMAIL }}
      E2E_RESIDENT_PASSWORD: ${{ secrets.E2E_RESIDENT_PASSWORD }}
      E2E_CONCIERGE_EMAIL: ${{ secrets.E2E_CONCIERGE_EMAIL }}
      E2E_CONCIERGE_PASSWORD: ${{ secrets.E2E_CONCIERGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chrome

      # When triggered by schedule, default to safe-desktop. When
      # triggered manually, honor the user's chosen suite. The step-
      # level `if:` conditions below match against either
      # inputs.suite (manual) OR a synthesized 'safe-desktop' value
      # for scheduled runs (set via env so the if: gates can read it).
      - name: Resolve scheduled suite
        if: ${{ github.event_name == 'schedule' }}
        run: echo "SUITE=safe-desktop" >> $GITHUB_ENV

      - name: Resolve manual suite
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "SUITE=${{ inputs.suite }}" >> $GITHUB_ENV

      - name: Check VERCEL_AUTOMATION_BYPASS_SECRET
        if: ${{ env.SUITE != 'api' }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is required for protected Vercel browser suites."
            exit 1
          fi

      - name: Check E2E_RATE_LIMIT_BYPASS_SECRET
        run: |
          if [ -z "$E2E_RATE_LIMIT_BYPASS_SECRET" ]; then
            echo "E2E_RATE_LIMIT_BYPASS_SECRET is required so production E2E does not trip live auth rate limits."
            exit 1
          fi

      - name: Check private production E2E credentials
        run: |
          missing=0
          for name in E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_RESIDENT_EMAIL E2E_RESIDENT_PASSWORD E2E_CONCIERGE_EMAIL E2E_CONCIERGE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required so production E2E does not depend on seeded demo credentials."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run production API regression
        if: ${{ env.SUITE == 'api' }}
        run: npm run test:e2e:prod:api

      - name: Run production UI walkthrough
        if: ${{ env.SUITE == 'ui' }}
        run: npm run test:e2e:prod:ui

      - name: Run production smoke suite
        if: ${{ env.SUITE == 'smoke' }}
        run: npm run test:e2e:prod:smoke

      - name: Run production-safe desktop suite
        if: ${{ env.SUITE == 'safe-desktop' }}
        run: npm run test:e2e:prod:safe:desktop

      - name: Run production-safe mobile suite
        if: ${{ env.SUITE == 'safe-mobile' }}
        run: npm run test:e2e:prod:safe:mobile

      - name: Run production-safe full suite
        if: ${{ env.SUITE == 'safe-full' }}
        run: npm run test:e2e:prod:safe

      - name: Run live integration suite
        if: ${{ env.SUITE == 'integrations' }}
        env:
          E2E_EXPECT_GOOGLE: ${{ vars.E2E_EXPECT_GOOGLE }}
          E2E_EXPECT_WHATSAPP: ${{ vars.E2E_EXPECT_WHATSAPP }}
          E2E_ALLOW_PROD_WRITES: ${{ secrets.E2E_ALLOW_PROD_WRITES }}
          E2E_LIVE_EMAIL_TO: ${{ secrets.E2E_LIVE_EMAIL_TO }}
          E2E_LIVE_WHATSAPP_TO: ${{ secrets.E2E_LIVE_WHATSAPP_TO }}
        run: npm run test:e2e:prod:integrations
